<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Pick who goes first with one touch from every player." />
    <title>Who goes first?</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-screen" aria-labelledby="gameTitle">
        <div
          class="play-stage"
          id="playStage"
          aria-describedby="gameTitle stageHint liveStatus"
          tabindex="0"
        >
          <div class="stage-grid" aria-hidden="true"></div>
          <div class="stage-glow" aria-hidden="true"></div>
          <div class="players-layer" id="playersLayer" aria-hidden="true"></div>
          <div class="stage-content">
            <p class="eyebrow" id="roundLabel">READY WHEN YOU ARE</p>
            <h2 id="gameTitle">Place your<br /><em>fingertips.</em></h2>
            <p class="stage-hint" id="stageHint">Everyone holds one finger on the screen. We’ll lock in once there are at least two.</p>
          </div>
          <div class="touch-count" id="touchCount" aria-hidden="true">
            <span class="touch-count__number">0</span>
            <span class="touch-count__label">touches</span>
          </div>
          <div class="winner-banner" id="winnerBanner" hidden>
            <span class="winner-banner__sparkle" aria-hidden="true">✦</span>
            <span>YOU GO FIRST!</span>
            <span class="winner-banner__sparkle" aria-hidden="true">✦</span>
          </div>
        </div>

        <div class="control-dock">
          <p class="status-text" id="statusText">Waiting for at least two fingers.</p>
          <div class="meter" aria-hidden="true"><span id="meterFill"></span></div>
        </div>
        <p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
